name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          unzip -o "$(ls *.zip | head -1)"
          cd TgWipe
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TgWipe-apk
          path: TgWipe/app/build/outputs/apk/debug/app-debug.apk
