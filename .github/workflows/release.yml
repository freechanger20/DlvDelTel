name: Release APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          unzip -o "$(ls *.zip | head -1)"
          cd TgWipe
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../TgWipe.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TgWipe ${{ github.run_number }}
          files: TgWipe.apk
          make_latest: true
